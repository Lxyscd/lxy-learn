<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>练习6：响应式网格</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f5f5; font-family: sans-serif; padding: 20px; }

    /* 网格容器 */
    .grid {
      display: grid;
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;

      /* 默认：1 列（手机端） */
      grid-template-columns: 1fr;
    }

    /* 平板：2 列 */
    @media (min-width: 481px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* 桌面：3 列 */
    @media (min-width: 769px) {
      .grid {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    /* 卡片样式 */
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 {
      color: #4fc08d;
      margin-bottom: 8px;
    }

    .card p {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="grid">
    <div class="card">
      <h3>门店A</h3>
      <p>北京 · 朝阳区</p>
      <p>月销售额：¥12,000</p>
    </div>
    <div class="card">
      <h3>门店B</h3>
      <p>上海 · 浦东新区</p>
      <p>月销售额：¥15,000</p>
    </div>
    <div class="card">
      <h3>门店C</h3>
      <p>广州 · 天河区</p>
      <p>月销售额：¥8,000</p>
    </div>
    <div class="card">
      <h3>门店D</h3>
      <p>北京 · 海淀区</p>
      <p>月销售额：¥20,000</p>
    </div>
    <div class="card">
      <h3>门店E</h3>
      <p>上海 · 静安区</p>
      <p>月销售额：¥11,000</p>
    </div>
    <div class="card">
      <h3>门店F</h3>
      <p>广州 · 越秀区</p>
      <p>月销售额：¥9,500</p>
    </div>
  </div>

  <!-- 提示：调整浏览器窗口宽度，观察列数变化 -->

</body>
</html>
